<svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="armor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#66bb6a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2e7d32;stop-opacity:1" />
    </linearGradient>
    <filter id="metallic">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="600" fill="#f5f5f5"/>
  
  <!-- Helmet with visor -->
  <rect x="160" y="50" width="80" height="90" rx="10" fill="url(#armor)" filter="url(#metallic)"/>
  <rect x="170" y="65" width="60" height="40" fill="#00aa00" opacity="0.6"/>
  <rect x="175" y="70" width="50" height="30" fill="#00ff00" opacity="0.3"/>
  
  <!-- Neck ring -->
  <rect x="175" y="135" width="50" height="20" fill="url(#armor)"/>
  
  <!-- Chest plate -->
  <rect x="120" y="155" width="160" height="100" rx="5" fill="url(#armor)" filter="url(#metallic)"/>
  <circle cx="200" cy="205" r="15" fill="#ffcc00" opacity="0.4"/>
  
  <!-- Left Shoulder armor -->
  <ellipse cx="90" cy="180" rx="35" ry="50" fill="url(#armor)"/>
  
  <!-- Right Shoulder armor -->
  <ellipse cx="310" cy="180" rx="35" ry="50" fill="url(#armor)"/>
  
  <!-- Left Arm gauntlet -->
  <g>
    <line x1="150" y1="160" x2="100" y2="220" stroke="#2e7d32" stroke-width="22" stroke-linecap="round"/>
    <rect x="88" y="210" width="24" height="30" fill="url(#armor)"/>
  </g>
  
  <!-- Right Arm gauntlet -->
  <g>
    <line x1="250" y1="160" x2="300" y2="220" stroke="#2e7d32" stroke-width="22" stroke-linecap="round"/>
    <rect x="288" y="210" width="24" height="30" fill="url(#armor)"/>
  </g>
  
  <!-- Leg armor -->
  <g>
    <polyline points="175,255 160,420" stroke="#2e7d32" stroke-width="24" stroke-linecap="round" fill="none"/>
    <rect x="148" y="410" width="24" height="40" fill="url(#armor)"/>
  </g>
  
  <g>
    <polyline points="225,255 240,420" stroke="#2e7d32" stroke-width="24" stroke-linecap="round" fill="none"/>
    <rect x="228" y="410" width="24" height="40" fill="url(#armor)"/>
  </g>
  
  <!-- Label -->
  <text x="200" y="550" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">
    Master Chief MJOLNIR Armor
  </text>
</svg>