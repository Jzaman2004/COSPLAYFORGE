<svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff00ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff00ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="600" fill="#1a1a1a"/>
  
  <!-- Glow effect background -->
  <rect width="400" height="600" fill="url(#neon)" opacity="0.05"/>
  
  <!-- NFT Certificate Border -->
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="url(#neon)" stroke-width="3" rx="10"/>
  <rect x="25" y="25" width="350" height="550" fill="none" stroke="url(#neon)" stroke-width="1" rx="8" opacity="0.5"/>
  
  <!-- Header -->
  <rect x="40" y="40" width="320" height="80" fill="url(#neon)" opacity="0.1" rx="5"/>
  <text x="200" y="70" font-size="28" font-weight="bold" text-anchor="middle" fill="#00ffff" filter="url(#glow)">
    COSPLAY
  </text>
  <text x="200" y="100" font-size="20" text-anchor="middle" fill="#ff00ff" filter="url(#glow)">
    Verified Build Certificate
  </text>
  
  <!-- Certificate Info -->
  <text x="60" y="160" font-size="14" font-weight="bold" fill="#00ffff">Character:</text>
  <text x="60" y="185" font-size="18" fill="#ffffff">Saitama (One Punch Man)</text>
  
  <text x="60" y="230" font-size="14" font-weight="bold" fill="#00ffff">Build Time:</text>
  <text x="60" y="255" font-size="16" fill="#ffffff">47 hours</text>
  
  <text x="60" y="300" font-size="14" font-weight="bold" fill="#00ffff">Creator:</text>
  <text x="60" y="325" font-size="16" fill="#ffffff">@YourHackathonTeam</text>
  
  <!-- Transaction hash -->
  <rect x="40" y="370" width="320" height="70" fill="#1a1a1a" stroke="#00ffff" stroke-width="1" rx="3" opacity="0.8"/>
  <text x="60" y="390" font-size="11" font-weight="bold" fill="#00ffff" font-family="monospace">TRANSACTION ID</text>
  <text x="60" y="415" font-size="10" fill="#00ff00" font-family="monospace">4v3xT9k2Lm8nP2qR7wS1aB4cD5eF9gH3jK6</text>
  
  <!-- Solana Badge -->
  <circle cx="200" cy="480" r="30" fill="none" stroke="url(#neon)" stroke-width="2"/>
  <text x="200" y="490" font-size="20" font-weight="bold" text-anchor="middle" fill="#00ffff">◎</text>
  
  <!-- Verified stamp -->
  <text x="200" y="545" font-size="12" text-anchor="middle" fill="#00ff00" filter="url(#glow)">
    ✓ VERIFIED ON SOLANA MAINNET
  </text>
</svg>