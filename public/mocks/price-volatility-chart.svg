<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#66bb6a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffeb3b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6f00;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="600" fill="#1a1a1a"/>
  
  <!-- Title -->
  <text x="60" y="50" font-size="28" font-weight="bold" fill="#00ffff">EVA Foam Price Volatility Analysis</text>
  <text x="60" y="80" font-size="14" fill="#00ff00">Snowflake Real-Time Data • Last 6 Months</text>
  
  <!-- Chart Background -->
  <rect x="80" y="120" width="900" height="420" fill="#0f3460" stroke="#00ffff" stroke-width="1" rx="5"/>
  
  <!-- Grid lines -->
  <g stroke="#00ffff" stroke-width="0.5" opacity="0.2">
    <!-- Vertical lines -->
    <line x1="180" y1="120" x2="180" y2="540"/>
    <line x1="280" y1="120" x2="280" y2="540"/>
    <line x1="380" y1="120" x2="380" y2="540"/>
    <line x1="480" y1="120" x2="480" y2="540"/>
    <line x1="580" y1="120" x2="580" y2="540"/>
    <line x1="680" y1="120" x2="680" y2="540"/>
    <line x1="780" y1="120" x2="780" y2="540"/>
    <line x1="880" y1="120" x2="880" y2="540"/>
    
    <!-- Horizontal lines -->
    <line x1="80" y1="200" x2="980" y2="200"/>
    <line x1="80" y1="280" x2="980" y2="280"/>
    <line x1="80" y1="360" x2="980" y2="360"/>
    <line x1="80" y1="440" x2="980" y2="440"/>
  </g>
  
  <!-- Y-axis labels (prices) -->
  <text x="50" y="545" font-size="10" text-anchor="end" fill="#00ffff">$10</text>
  <text x="50" y="465" font-size="10" text-anchor="end" fill="#00ffff">$15</text>
  <text x="50" y="385" font-size="10" text-anchor="end" fill="#00ffff">$20</text>
  <text x="50" y="305" font-size="10" text-anchor="end" fill="#00ffff">$25</text>
  <text x="50" y="225" font-size="10" text-anchor="end" fill="#00ffff">$30</text>
  <text x="50" y="145" font-size="10" text-anchor="end" fill="#00ffff">$35</text>
  
  <!-- X-axis labels (months) -->
  <text x="180" y="565" font-size="10" text-anchor="middle" fill="#00ffff">Jan</text>
  <text x="280" y="565" font-size="10" text-anchor="middle" fill="#00ffff">Feb</text>
  <text x="380" y="565" font-size="10" text-anchor="middle" fill="#00ffff">Mar</text>
  <text x="480" y="565" font-size="10" text-anchor="middle" fill="#00ffff">Apr</text>
  <text x="580" y="565" font-size="10" text-anchor="middle" fill="#00ffff">May</text>
  <text x="680" y="565" font-size="10" text-anchor="middle" fill="#00ffff">Jun</text>
  
  <!-- Price line chart -->
  <!-- Data: Jan $18.50, Feb $17.20, Mar $12.10, Apr $14.50, May $13.20, Jun $22.99 -->
  <polyline points="180,423 280,450 380,544 480,500 580,524 680,300" 
    fill="none" stroke="url(#chartGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Data points -->
  <circle cx="180" cy="423" r="5" fill="#ffeb3b" stroke="#00ffff" stroke-width="1"/>
  <circle cx="280" cy="450" r="5" fill="#ffeb3b" stroke="#00ffff" stroke-width="1"/>
  <circle cx="380" cy="544" r="5" fill="#ff6f00" stroke="#00ffff" stroke-width="1"/>
  <circle cx="480" cy="500" r="5" fill="#ff9800" stroke="#00ffff" stroke-width="1"/>
  <circle cx="580" cy="524" r="5" fill="#ff6f00" stroke="#00ffff" stroke-width="1"/>
  <circle cx="680" cy="300" r="5" fill="#66bb6a" stroke="#00ffff" stroke-width="2"/>
  
  <!-- Current price annotation -->
  <g>
    <line x1="680" y1="290" x2="680" y2="250" stroke="#00ff00" stroke-width="2" stroke-dasharray="5,5"/>
    <rect x="710" y="230" width="160" height="40" fill="#00ff00" opacity="0.1" stroke="#00ff00" stroke-width="1" rx="3"/>
    <text x="790" y="245" font-size="12" font-weight="bold" text-anchor="middle" fill="#00ff00">CURRENT: $22.99</text>
    <text x="790" y="260" font-size="10" text-anchor="middle" fill="#00ff00">↑ 38% below avg</text>
  </g>
  
  <!-- Legend -->
  <rect x="1000" y="130" width="180" height="150" fill="#0f3460" stroke="#00ffff" stroke-width="1" rx="3"/>
  
  <text x="1020" y="155" font-size="12" font-weight="bold" fill="#00ffff">KEY METRICS</text>
  
  <text x="1020" y="185" font-size="10" fill="#00ffff">Avg Price: $18.42</text>
  <text x="1020" y="205" font-size="10" fill="#00ffff">High: $22.99</text>
  <text x="1020" y="225" font-size="10" fill="#00ffff">Low: $12.10</text>
  <text x="1020" y="245" font-size="10" fill="#00ff00">Trend: ↑ Rising</text>
  <text x="1020" y="265" font-size="10" fill="#ffeb3b">Volatility: Medium</text>
  
  <!-- Insight box -->
  <rect x="1000" y="310" width="180" height="100" fill="#00ff00" opacity="0.05" stroke="#00ff00" stroke-width="1" rx="3"/>
  
  <text x="1020" y="330" font-size="11" font-weight="bold" fill="#00ff00">💡 INSIGHT</text>
  <text x="1020" y="350" font-size="9" fill="#00ff00">38% price drop</text>
  <text x="1020" y="366" font-size="9" fill="#00ff00">detected Mar-Jun</text>
  <text x="1020" y="382" font-size="9" fill="#00ff00">Price locked now</text>
  <text x="1020" y="398" font-size="9" font-weight="bold" fill="#00ff00">✓ Optimal timing</text>
</svg>