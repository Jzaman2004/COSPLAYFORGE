<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Figma logo -->
  <rect width="200" height="200" fill="none"/>
  
  <!-- Figma F shape -->
  <g transform="translate(50,40)">
    <!-- Left circle -->
    <circle cx="20" cy="20" r="20" fill="#0acf83"/>
    
    <!-- Top right circle -->
    <circle cx="60" cy="20" r="20" fill="#a259ff"/>
    
    <!-- Right circle -->
    <circle cx="60" cy="60" r="20" fill="#ff6b6b"/>
    
    <!-- Bottom left circle -->
    <circle cx="20" cy="60" r="20" fill="#1abcfe"/>
    
    <!-- Center square -->
    <rect x="40" y="40" width="40" height="40" fill="#f24e1e"/>
  </g>
  
  <!-- Text -->
  <text x="100" y="180" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">FIGMA</text>
</svg>