<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
      .spinner { animation: spin 2s linear infinite; transform-origin: 200px 200px; }
      .pulse-text { animation: pulse 1s ease-in-out infinite; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="#0f0f1e"/>
  
  <!-- Solana gradient circle -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="#14f195" stroke-width="8" opacity="0.3"/>
  
  <!-- Spinning indicator -->
  <g class="spinner">
    <circle cx="200" cy="60" r="12" fill="#14f195"/>
    <circle cx="320" cy="130" r="10" fill="#9945ff" opacity="0.7"/>
    <circle cx="340" cy="260" r="8" fill="#ff6b6b" opacity="0.5"/>
  </g>
  
  <!-- Center Solana logo -->
  <text x="200" y="210" font-size="60" font-weight="bold" text-anchor="middle" fill="#14f195">◎</text>
  
  <!-- Status text -->
  <text x="200" y="280" font-size="18" font-weight="bold" text-anchor="middle" fill="#14f195" class="pulse-text">
    MINTING...
  </text>
  
  <!-- Message -->
  <text x="200" y="320" font-size="12" text-anchor="middle" fill="#9945ff">
    Verifying on Solana mainnet
  </text>
</svg>